name: public-site

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheme-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'buffbeefalo/scheme' && (github.event_name != 'release' || github.event.release.tag_name == 'v1.1.0')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the presentation being published
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          package-manager-cache: false
      - name: Check the reviewed source inventory
        run: node scripts/check-release.js
      - name: Test media validation
        run: node --test test/media.test.js
      - name: Download the three explicit release films
        shell: bash
        run: |
          set -euo pipefail
          scheme_media_dir="$RUNNER_TEMP/scheme-release-media"
          mkdir "$scheme_media_dir"
          curl --fail --silent --show-error --location --output "$scheme_media_dir/scheme-product.mp4" https://github.com/buffbeefalo/scheme/releases/download/v1.1.0/scheme-product.mp4
          curl --fail --silent --show-error --location --output "$scheme_media_dir/scheme-setup.mp4" https://github.com/buffbeefalo/scheme/releases/download/v1.1.0/scheme-setup.mp4
          curl --fail --silent --show-error --location --output "$scheme_media_dir/scheme-capabilities.mp4" https://github.com/buffbeefalo/scheme/releases/download/v1.1.0/scheme-capabilities.mp4
      - name: Verify reviewed bytes and build the static site
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-media.js --media-dir "$RUNNER_TEMP/scheme-release-media"
          node scripts/build-site.js --media-dir "$RUNNER_TEMP/scheme-release-media" --out "$RUNNER_TEMP/scheme-pages"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Upload only the static public artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: ${{ runner.temp }}/scheme-pages
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
