name: secrets-scan
permissions:
  contents: read
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'
jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks and scan history and files
        shell: bash
        run: |
          set -euo pipefail

          setup_failed() {
            printf '%s\n' 'Secret scan setup failed.'
            exit 1
          }

          if ! umask 077 2>/dev/null; then
            setup_failed
          fi
          if [[ -z "${RUNNER_TEMP:-}" ]]; then
            setup_failed
          fi
          if ! { scan_tmp=$(mktemp -d "$RUNNER_TEMP/scheme-gitleaks.XXXXXX"); } 2>/dev/null; then
            setup_failed
          fi

          cleanup() {
            cleanup_status=$?
            trap - EXIT
            if ! { rm -rf -- "$scan_tmp"; } >/dev/null 2>&1; then
              printf '%s\n' 'Secret scan cleanup failed.'
              if [[ "$cleanup_status" -eq 0 ]]; then
                cleanup_status=1
              fi
            fi
            exit "$cleanup_status"
          }
          trap cleanup EXIT

          # Outer redirections also suppress diagnostics if a private log cannot be opened.
          if ! { : >"$scan_tmp/setup.log"; } 2>/dev/null; then
            setup_failed
          fi
          if ! { : 2>>"$scan_tmp/setup.log" >"$scan_tmp/history.log"; } 2>/dev/null; then
            setup_failed
          fi
          if ! { : 2>>"$scan_tmp/setup.log" >"$scan_tmp/files.log"; } 2>/dev/null; then
            setup_failed
          fi

          if ! { curl --fail --silent --show-error --location --output "$scan_tmp/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz >>"$scan_tmp/setup.log" 2>&1; } 2>/dev/null; then
            setup_failed
          fi
          if ! { printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$scan_tmp/gitleaks.tar.gz" 2>>"$scan_tmp/setup.log" >"$scan_tmp/checksums"; } 2>/dev/null; then
            setup_failed
          fi
          if ! { sha256sum --check "$scan_tmp/checksums" >>"$scan_tmp/setup.log" 2>&1; } 2>/dev/null; then
            setup_failed
          fi
          if ! { tar --extract --gzip --file "$scan_tmp/gitleaks.tar.gz" --directory "$scan_tmp" gitleaks >>"$scan_tmp/setup.log" 2>&1; } 2>/dev/null; then
            setup_failed
          fi
          if ! { chmod 700 "$scan_tmp/gitleaks" >>"$scan_tmp/setup.log" 2>&1; } 2>/dev/null; then
            setup_failed
          fi

          # GitHub starts this step in the checkout root.
          scan_status=0
          if { "$scan_tmp/gitleaks" git --redact=100 --config .gitleaks.toml --log-opts=--all . >"$scan_tmp/history.log" 2>&1; } 2>/dev/null; then
            printf '%s\n' 'History scan passed.'
          else
            printf '%s\n' 'History scan failed.'
            scan_status=1
          fi
          if { "$scan_tmp/gitleaks" dir --redact=100 --config .gitleaks.toml . >"$scan_tmp/files.log" 2>&1; } 2>/dev/null; then
            printf '%s\n' 'File scan passed.'
          else
            printf '%s\n' 'File scan failed.'
            scan_status=1
          fi
          exit "$scan_status"
